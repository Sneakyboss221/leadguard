# Demo theme (app.py). Pinned to light so the clinical-paper styling looks the same on every machine.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fbfbfa"
secondaryBackgroundColor = "#f4f3f0"
textColor = "#16161a"
font = "sans serif"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
